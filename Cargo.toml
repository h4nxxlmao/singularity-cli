[package]
name = "singularitycli"
version = "0.1.0"
edition = "2021"
description = "Universal project command runner. One set of commands for every project type."
homepage = "https://getsingularity.lol/cli"
repository = "https://github.com/h4nxxlmao/singularity-cli"
license = "MIT"
keywords = ["cli", "build-tool", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sgl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
ignore = "0.4"
which = "6"
owo-colors = { version = "4", features = ["supports-colors"] }
semver = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
